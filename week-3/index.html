<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex, nofollow">
        <title>Week 3 | Media & CSS</title>
        <meta name="description" content="This week we will be looking at media and and introduction to CSS">
        <!--Add our CSS-->
        <link rel="stylesheet" href="./css/style.css">
    </head>
 <body>
    <header>
        <img src="./img/lorem-logo.png" alt="header logo">
        <nav>
            <menu>
                <li><a href="index.html">Link One</a></li>
                <li><a href="index.html">Link Two</a></li>
                <li><a href="index.html">Link Three</a></li>
            </menu>
        </nav>
    </header>
    <!--the main text of this page-->
    <main>
        <!--This first section of content is called a hero/masthead-->
        <section>
            <div>
                <h1>This is an Introduction Title</h1>
            </div>
        </section>
        <section>
            <!--Column One-->
            <div>
                <figure>
                    <img src="./img/toronto.jpg" alt="Toronto Skyline">
                    <figcaption>Image of Toronto Skyline
                    </figcaption> 
                </figure>
            </div>
            <!--Column Two-->
            <div>
                <h2>I am a Title</h2>
                <p>I am a paragraph</p>
            </div>
        </section>
        <!--Our next row of content will hold our videos-->
        <h3>iframe Video</h3>
        <div><iframe width="560" height="315" src="https://www.youtube.com/embed/lVehsRqmQqs?si=0E00JQYF_efSzh2_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
        <div>
            <h3>HTML Video Player Example</h3>
            <!--Alternate to embedding-->
            <video controls loop autoplay poster="./img/toronto.jpg">
                <source src="./video/toronto.mp4" type="video/mp4"> 
                Your browser sucks upgrade the damn thing 
            </video>
        </div>
    </main>
    <footer>
        <h6>&copy; Week 3 Lesson</h6>
    </footer>
</body>
</html>
